name: Run the examples

env:
  GOOGLE_CLOUD_PROJECT: gb-poc-373711

  WORKLOAD_IDENTITY_PROVIDER: 'projects/975119474255/locations/global/workloadIdentityPools/gb-github-actions-ci-cd-pool/providers/gb-github-actions-ci-cd-provider'
  SA_CI_CD_EMAIL: 'sa-bigtesty@gb-poc-373711.iam.gserviceaccount.com'

on:
  workflow_dispatch:

jobs:
  run-example:
    name: Run ${{ matrix.example }}
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    strategy:
      fail-fast: false
      matrix:
        example: [01-queries, 02-assertion-functions, 03-merge-with-ddl, 05-python-tests]

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7'

      - name: 'Google auth'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SA_CI_CD_EMAIL }}'

      - name: 'Set up uv'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # BigTesty from the sources of the repo.
      - name: 'Set up BigTesty'
        run: uv sync --frozen

      - name: 'Run the example'
        run: |
          if [ "${{ matrix.example }}" = "05-python-tests" ]; then
            uv run pytest examples/05-python-tests --bigtesty-config examples/05-python-tests/bigtesty.yaml
          else
            uv run bigtesty test --config examples/${{ matrix.example }}/bigtesty.yaml
          fi
