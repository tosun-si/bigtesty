name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
    tags-ignore: ['*']

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: .pre-commit-config.yaml

    - name: Cache the pre-commit hook environments
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      run: uvx pre-commit run --all-files --show-diff-on-failure

  checks:
    name: Lint, types and unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Ruff
      run: |
        uv run ruff check src tests
        uv run ruff format --check src tests

    - name: Mypy
      run: uv run mypy src

    - name: Unit tests
      run: uv run pytest

    - name: JSON Schemas are up to date
      run: |
        uv run bigtesty schema --output-dir schemas
        git diff --exit-code schemas

  package:
    name: Build and smoke test the wheel
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.13'
        enable-cache: true

    - name: Build
      run: uv build

    - name: Install the wheel in a fresh venv and run the CLI
      run: |
        uv venv /tmp/smoke
        uv pip install --python /tmp/smoke dist/*.whl
        /tmp/smoke/bin/bigtesty --version
        /tmp/smoke/bin/bigtesty test --help
        for config in examples/*/bigtesty.yaml; do /tmp/smoke/bin/bigtesty validate --config "$config"; done
        uv pip install --python /tmp/smoke pytest
        /tmp/smoke/bin/pytest --help | grep -- --bigtesty-project
