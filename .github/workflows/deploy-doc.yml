name: Documentation

on:
  push:
    branches: [main]
    paths: ['bigtesty-doc/**', '.github/workflows/deploy-doc.yml']
  pull_request:
    paths: ['bigtesty-doc/**', '.github/workflows/deploy-doc.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bigtesty-doc

jobs:
  build:
    name: Build the Starlight documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bigtesty-doc/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails on a broken internal link (starlight-links-validator).
      - name: Build website
        run: npm run build

      - name: Upload Build Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: bigtesty-doc/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
