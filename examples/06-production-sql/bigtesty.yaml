# yaml-language-server: $schema=https://raw.githubusercontent.com/tosun-si/bigtesty/main/schemas/bigtesty-config.schema.json

# The GCP project is passed with --project or the GOOGLE_CLOUD_PROJECT env var.
location: EU
tests: tests

# The production SQL hardcodes the production project: its references to the datasets are rewritten too.
project_aliases: [my-prod-project]

# The template engine of the team renders the SQL before the rewrite of the datasets.
sql_renderer:
  module: tests/render.py
  function: render
vars:
  env: test

datasets:
  - id: monitoring
    tables:
      - id: job_failure
        schema:
          - { name: featureName, type: STRING }
          - { name: jobName, type: STRING }
          - { name: componentType, type: STRING }
          - { name: dwhCreationDate, type: TIMESTAMP }
        partitioning: { type: DAY, field: dwhCreationDate }

      - id: daily_failures
        schema:
          - { name: day, type: DATE }
          - { name: featureName, type: STRING }
          - { name: failuresCount, type: INT64 }
          - { name: env, type: STRING }
