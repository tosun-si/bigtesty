[project]
name = "bigtesty-uv-project-example"
version = "0.1.0"
description = "A project testing its BigQuery SQL with BigTesty, managed with uv."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["bigtesty==1.3.0", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
